name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test HyprWin.sln -c Release --nologo

      - name: Publish single-file exe
        run: >
          dotnet publish src\HyprWin.App\HyprWin.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/HyprWin.App.exe
          generate_release_notes: true
